<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cumplimiento de planes · GPM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>

  :root{
    --bg:#F1F3F6; --surface:#FFFFFF; --surface-alt:#F7F8FA;
    --border:#DCE1E7; --border-strong:#B9C1CB;
    --text:#141B24; --text-muted:#5B6474; --text-faint:#828B98;
    --accent:#0B4F9E; --accent-strong:#08386F; --accent-soft:#E4EDF9;
    --success:#146C36; --success-mid:#2E9A57; --success-soft:#E3F3E8;
    --warning:#8A4B00; --warning-mid:#D98A1C; --warning-soft:#FBEBD8;
    --danger:#A31E24; --danger-mid:#D2434A; --danger-soft:#FBE2E3;
    --neutral-chip:#EDEFF2;
    --radius-sm:6px; --radius-md:10px;
    --shadow:0 1px 2px rgba(20,27,36,0.06), 0 1px 0 rgba(20,27,36,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;}
  .shell{max-width:1440px;margin:0 auto;padding:20px 24px 64px;}

  /* Header */
  header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;margin-bottom:16px;border-bottom:1px solid var(--border-strong);}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-logo{height:36px;width:auto;flex-shrink:0;}
  .brand-text h1{font-size:20px;font-weight:700;margin:0 0 3px;letter-spacing:-0.01em;}
  .brand-text p{margin:0;color:var(--text-muted);font-size:13px;}
  .update-badge{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 9px;background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;font-size:11.5px;font-weight:600;width:fit-content;}
  .conn-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
  .field-group{display:flex;flex-direction:column;}
  .field-group label{font-size:11.5px;color:var(--text-muted);margin-bottom:3px;}
  #sheetUrl{width:330px;max-width:60vw;padding:7px 9px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:12.5px;font-family:'IBM Plex Mono',monospace;background:var(--surface-alt);color:var(--text);}
  #sheetUrl:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--surface);}
  select,.btn,input[type=search]{font-family:inherit;font-size:12.5px;padding:7px 11px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface-alt);color:var(--text);}
  .btn{cursor:pointer;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .btn-primary:disabled{background:#9FB4CC;border-color:#9FB4CC;cursor:progress;}
  .btn:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible,.tema-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .status-line{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);margin-bottom:14px;flex-wrap:wrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);flex:none;}
  .dot.ok{background:var(--success-mid);} .dot.err{background:var(--danger-mid);} .dot.demo{background:var(--warning-mid);}
  .status-line .spacer{flex:1;}
  .corte{display:flex;align-items:center;gap:8px;}
  .corte select{padding:5px 9px;}

  /* Tabs */
  nav.tabs{display:flex;flex-wrap:wrap;row-gap:2px;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:18px;border-bottom:1px solid var(--border);scrollbar-width:thin;}
  .tab-group{display:flex;align-items:flex-end;gap:2px;padding-left:10px;margin-left:6px;border-left:1px solid var(--border);}
  .tab-group:first-child{border-left:none;margin-left:0;padding-left:0;}
  .tab-group-label{font-size:11px;color:var(--text-faint);align-self:center;margin-right:6px;white-space:nowrap;}
  .tab{appearance:none;border:none;background:none;cursor:pointer;font-family:inherit;font-size:13px;color:var(--text-muted);padding:8px 10px 9px;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--accent-strong);border-bottom-color:var(--accent);font-weight:600;}
  .tab .pct{font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--neutral-chip);color:var(--text-muted);}
  .pct.good{background:var(--success-soft);color:var(--success);} .pct.mid{background:var(--warning-soft);color:var(--warning);} .pct.bad{background:var(--danger-soft);color:var(--danger);}

  /* KPIs */
  .view-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px;}
  .view-head h2{font-size:18px;margin:0;}
  .view-head p{margin:0;color:var(--text-muted);font-size:13px;}
  .kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--border-strong);}
  .kpi-card.k-accent{border-top-color:var(--accent);} .kpi-card.k-success{border-top-color:var(--success-mid);}
  .kpi-card.k-danger{border-top-color:var(--danger-mid);} .kpi-card.k-warning{border-top-color:var(--warning-mid);}
  .kpi-label{margin:0;font-size:12px;color:var(--text-muted);font-weight:500;}
  .kpi-value{margin:4px 0 2px;font-size:28px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;}
  .kpi-sub{margin:0;font-size:12px;color:var(--text-faint);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0;}
  .panel h3{font-size:14.5px;margin:0 0 2px;}
  .panel-sub{margin:0 0 12px;font-size:12px;color:var(--text-muted);}
  .grid-2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;}
  .grid-2 > .panel{margin-bottom:16px;}
  .chart-box{position:relative;height:260px;}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}

  /* Cumplimiento por tema */
  .tema-list{display:flex;flex-direction:column;}
  .tema-row{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(120px,2fr) 64px 84px;gap:12px;align-items:center;padding:9px 6px;border-top:1px solid var(--border);cursor:pointer;border-radius:var(--radius-sm);}
  .tema-row:first-child{border-top:none;}
  .tema-row:hover{background:var(--surface-alt);}
  .tema-name{font-weight:600;font-size:13px;}
  .tema-desc{font-size:11.5px;color:var(--text-muted);line-height:1.3;}
  .bar{height:10px;background:var(--neutral-chip);border-radius:999px;overflow:hidden;position:relative;}
  .bar > span{position:absolute;inset:0 auto 0 0;border-radius:999px;}
  .bar-meta{font-size:11px;color:var(--text-faint);margin-top:3px;}
  .tema-pct{font-size:16px;font-weight:700;text-align:right;}
  .tema-late{font-size:12px;text-align:right;color:var(--text-muted);}
  .tema-late b{color:var(--danger);}

  /* Tablas simples */
  .tbl-wrap{overflow-x:auto;}
  table.simple{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.simple th{text-align:left;font-weight:600;color:var(--text-muted);font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap;}
  table.simple td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
  table.simple tr:hover td{background:var(--surface-alt);}
  .chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--neutral-chip);color:var(--text-muted);white-space:nowrap;}
  .chip.late{background:var(--danger-soft);color:var(--danger);font-weight:600;}
  .chip.now{background:var(--warning-soft);color:var(--warning);font-weight:600;}
  .empty{padding:18px;text-align:center;color:var(--text-muted);font-size:13px;}
  .more{font-size:12px;color:var(--text-muted);padding-top:8px;}

  /* Filtros */
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px;}
  .filters input[type=search]{min-width:240px;}
  .filters .count{margin-left:auto;font-size:12px;color:var(--text-muted);}

  /* Grilla de planificación: la pieza central */
  .plan-wrap{overflow:auto;max-height:72vh;border:1px solid var(--border);border-radius:var(--radius-sm);}
  table.plan{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%;}
  table.plan th,table.plan td{background:var(--surface);}
  table.plan thead th{position:sticky;z-index:2;background:var(--surface-alt);font-weight:600;color:var(--text-muted);font-size:11px;}
  table.plan thead tr:first-child th{top:0;height:26px;}
  table.plan thead tr:nth-child(2) th{top:26px;height:20px;font-weight:400;color:var(--text-faint);font-size:10px;}
  table.plan th.m{text-align:center;border-left:1px solid var(--border-strong);border-bottom:1px solid var(--border);}
  table.plan th.w{text-align:center;width:17px;min-width:17px;padding:0;border-bottom:1px solid var(--border-strong);}
  table.plan th.w.ms,table.plan td.c.ms{border-left:1px solid var(--border-strong);}
  .sticky{position:sticky;left:0;z-index:1;}
  table.plan thead th.sticky{z-index:3;}
  table.plan th.info{text-align:left;padding:0 10px;border-bottom:1px solid var(--border-strong);vertical-align:bottom;}
  table.plan td.info{padding:6px 10px;border-bottom:1px solid var(--border);min-width:300px;max-width:380px;box-shadow:1px 0 0 var(--border-strong);}
  .act{font-weight:500;line-height:1.3;}
  .act-meta{font-size:11px;color:var(--text-faint);line-height:1.35;margin-top:1px;}
  .act-meta .mono{color:var(--text-muted);}
  .obs{font-size:11px;color:var(--accent-strong);margin-top:2px;}
  table.plan td.c{padding:0;text-align:center;border-bottom:1px solid var(--border);height:34px;}
  table.plan td.pctc,table.plan th.pctc{padding:0 10px;text-align:right;border-bottom:1px solid var(--border);border-left:1px solid var(--border-strong);white-space:nowrap;font-weight:600;}
  .cur{background:linear-gradient(var(--accent-soft),var(--accent-soft)) !important;}
  .sq{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;}
  .sq.d{background:var(--success-mid);}
  .sq.o{background:var(--danger-mid);}
  .sq.c{background:var(--warning-mid);}
  .sq.p{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);}
  .sq.n{width:3px;height:3px;border-radius:50%;background:var(--border);}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-muted);margin:0 0 10px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}

  footer{margin-top:24px;font-size:11.5px;color:var(--text-faint);}

  @media (max-width:980px){
    .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));}
    .grid-2{grid-template-columns:1fr;}
    .tema-row{grid-template-columns:1fr 64px;}
    .tema-row .bar-col,.tema-row .tema-late{grid-column:1 / -1;}
    .tema-late{text-align:left;}
  }
  @media (max-width:560px){
    nav.tabs{flex-wrap:nowrap;}
    .shell{padding:14px 12px 48px;}
    .kpi-value{font-size:23px;}
    #sheetUrl{width:100%;max-width:none;}
    .conn-panel{width:100%;}
    .filters input[type=search]{min-width:0;width:100%;}
    table.plan td.info{min-width:210px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

  /* ---- Específico de cumplimiento ---- */
  .opt{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-muted);cursor:pointer;}
  .opt input{accent-color:var(--accent);}
  table.mx{border-collapse:separate;border-spacing:0;font-size:12px;width:100%;}
  table.mx th,table.mx td{background:var(--surface);}
  table.mx thead th{position:sticky;top:0;z-index:2;background:var(--surface-alt);font-size:11px;font-weight:600;color:var(--text-muted);padding:7px 6px;border-bottom:1px solid var(--border-strong);white-space:nowrap;}
  table.mx th.l,table.mx td.l{text-align:left;}
  table.mx td{padding:6px;border-bottom:1px solid var(--border);vertical-align:middle;text-align:center;}
  table.mx td.info{text-align:left;min-width:260px;max-width:360px;}
  table.mx tr.pl{cursor:pointer;}
  table.mx tr.pl:hover td{background:var(--surface-alt);}
  table.mx th.mo,table.mx td.mo{width:34px;min-width:34px;padding:4px 2px;}
  table.mx td.mo.curm,table.mx th.mo.curm{background:var(--accent-soft);}
  .cell{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;border-radius:4px;font-size:10.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .cell.ok{background:var(--success-mid);color:#fff;}
  .cell.bad{background:var(--danger-mid);color:#fff;}
  .cell.rep{background:var(--warning-mid);color:#fff;}
  .cell.fut{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent-strong);}
  .cell.emp{width:4px;min-width:4px;height:4px;border-radius:50%;background:var(--border);}
  .num{font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  tr.det td{background:var(--surface-alt) !important;padding:10px 12px;text-align:left;}
  .om-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 16px;font-size:11.5px;}
  .om-list div{display:flex;gap:8px;align-items:baseline;border-bottom:1px dotted var(--border);padding:2px 0;}
  .om-list .st{margin-left:auto;}
  .chip.ok{background:var(--success-soft);color:var(--success);font-weight:600;}
  .chip.rep{background:var(--warning-soft);color:var(--warning);font-weight:600;}
  .caso{font-size:11px;color:var(--text-muted);}
  .caso.warn{color:var(--warning);font-weight:600;}
  .kpi-row.k3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .mini-list{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
  .mini-list .row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 6px;}
  @media (max-width:980px){.kpi-row.k3{grid-template-columns:1fr;}}
</style>
</head>

<script>
/* =========================================================

   ========================================================= */
const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbytLtVcDftKmsfjqtYqR3leP_L8jeMtZu_10aZ7Y3KJfHHbAg2v1jJykFgl6Ff8HKQk/exec";   // URL /exec del Apps Script de cumplimiento
const GRUPOS = ["Línea", "Medición", "Plantas compresoras", "Otros"];
const TEMAS = {
  "INSPECCIONES": { grupo: "Línea", desc: "Inspección de instalaciones de superficie" },
  "Mtto XNV":     { grupo: "Línea", desc: "Engrase, purga, verificación y ajuste de XNV" },
  "PSV":          { grupo: "Línea", desc: "Calibración de PSV" },
  "PIT - PI":     { grupo: "Línea", desc: "Transmisores e indicadores de presión" },
  "SRP - TG":     { grupo: "Línea", desc: "SRP y generadores termoeléctricos (TEG)" },
  "M. BB":        { grupo: "Línea", desc: "Bancos de baterías" },
  "PAT - POT":    { grupo: "Línea", desc: "Puesta a tierra y potenciales" },
  "PM":           { grupo: "Medición", desc: "Puentes de medición (EMED)" },
  "PC TTY":       { grupo: "Plantas compresoras", desc: "Planta Compresora Tratayén" },
  "PC SQL":       { grupo: "Plantas compresoras", desc: "Planta Compresora Salliqueló" }
};
const PREDICTIVAS = ["PM13", "PM14"];
const UMBRAL_MASIVA = 3;           // OM del mismo equipo y mes para considerar creación masiva
const STORAGE_KEY = "gpm_cumplimiento_cfg";
/* ========================================================= */

const MS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const PER = { mensual: 12, bimestral: 6, trimestral: 4, cuatrimestral: 3, semestral: 2, anual: 1 };
const PLURI = ["bienal","trienal","quinquenal","decenal"];
const DEMO = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nk = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");

let raw = { om: [], planes: [] };
let state = { vista: "Resumen", corte: "hoy", excl: false, fuente: "demo", filtros: {}, abiertos: new Set() };
let M = null;          // modelo calculado
let charts = {};

/* ---------- Utilidades ---------- */
function loadCfg(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }catch(e){ return {}; } }
function saveCfg(p){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(Object.assign(loadCfg(), p))); }catch(e){} }
function pick(o, ...cands){
  if (!o.__k){ Object.defineProperty(o, "__k", { value: Object.fromEntries(Object.keys(o).map(k => [nk(k), k])) }); }
  for (const c of cands){ const k = o.__k[nk(c)]; if (k !== undefined && o[k] !== "" && o[k] !== null) return o[k]; }
  return "";
}
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function fecha(v){
  if (v === "" || v === null || v === undefined) return "";
  if (typeof v === "number"){ const d = new Date(Date.UTC(1899, 11, 30) + v * 864e5); return iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
  const s = String(v).trim();
  let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if (m) return s;
  m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/.exec(s); if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  const d = new Date(s); return isNaN(d) ? "" : iso(d);
}
function numPlan(v){ const s = String(v ?? "").trim(); if (!s || /s\/?plan/i.test(s)) return ""; const n = parseFloat(s); return isNaN(n) ? "" : String(Math.round(n)); }
function numEq(v){ const s = String(v ?? "").trim(); if (!s) return ""; const n = parseFloat(s); return isNaN(n) ? s : String(Math.round(n)); }
const addDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); return iso(new Date(y, m - 1, d + n)); };
const dias = (a, b) => { const A = a.split("-").map(Number), B = b.split("-").map(Number); return Math.round((new Date(B[0], B[1] - 1, B[2]) - new Date(A[0], A[1] - 1, A[2])) / 864e5); };
const fmtF = (s) => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : "";

/* ---------- Corte ---------- */
function corteInfo(){
  const hoy = new Date(), anio = hoy.getFullYear();
  if (state.corte === "hoy") return { anio, fecha: iso(hoy), mes: hoy.getMonth(), txt: "a hoy" };
  const m = +state.corte;
  return { anio, fecha: iso(new Date(anio, m + 1, 0)), mes: m, txt: `al cierre de ${MESES[m]}` };
}

/* ---------- Modelo ---------- */
function construir(){
  const C = corteInfo(), A = String(C.anio), frac = (C.mes + 1) / 12;
  const planes = new Map();

  raw.planes.forEach(r => {
    const p = numPlan(pick(r, "N° Plan", "Plan")); if (!p) return;
    let pl = planes.get(p);
    if (!pl){
      const clase = String(pick(r, "Clase Plan", "Clase")).trim().toUpperCase();
      const tema = String(pick(r, "Tema")).trim() || "Sin tema";
      pl = { plan: p, desc: String(pick(r, "Descripción", "Descripcion")), clase, tipo: PREDICTIVAS.includes(clase) ? "Predictivo" : "Preventivo",
             tema, filas: 0, frecs: [], omsAll: [], oms: [] };
      planes.set(p, pl);
    }
    pl.filas++;
    pl.frecs.push(String(pick(r, "Frecuencia a usar", "Frecuencia", "Frecuencia SAP")).trim().toLowerCase());
  });

  const fuera = new Map(), correctivas = [];
  raw.om.forEach(r => {
    const o = {
      om: numEq(pick(r, "N° OM", "OM")), clase: String(pick(r, "Clase OM")), ut: String(pick(r, "Ubicación Técnica", "Ubicacion Tecnica")),
      fi: fecha(pick(r, "Fecha Inicio")), desc: String(pick(r, "Descripción", "Descripcion")), est: String(pick(r, "Estatus")).toUpperCase(),
      plan: numPlan(pick(r, "N° Plan", "Plan")), eq: numEq(pick(r, "Equipo"))
    };
    if (!o.plan){ if (o.fi.slice(0, 4) === A) correctivas.push(o); return; }
    const pl = planes.get(o.plan);
    if (!pl){
      if (o.fi.slice(0, 4) === A){ const f = fuera.get(o.plan) || { plan: o.plan, desc: o.desc, oms: [] }; f.oms.push(o); fuera.set(o.plan, f); }
      return;
    }
    pl.omsAll.push(o);
    if (o.fi.slice(0, 4) === A) pl.oms.push(o);
  });

  const lista = [];
  const masivas = [];
  planes.forEach(pl => {
    const ll = new Map();
    pl.oms.forEach(o => {
      const item = o.eq ? "E" + o.eq : "U" + o.ut + "|" + o.desc.trim().toUpperCase();
      const k = item + "|" + o.fi.slice(0, 7);
      let l = ll.get(k);
      if (!l){ l = { item, eqTxt: o.eq || o.ut, desc: o.desc, mes: +o.fi.slice(5, 7) - 1, fmin: o.fi, oms: [] }; ll.set(k, l); }
      l.oms.push(o); if (o.fi < l.fmin) l.fmin = o.fi;
    });
    const llam = [...ll.values()];
    llam.forEach(l => {
      l.cumplido = l.oms.some(o => o.est.includes("CERRADA"));
      l.reprog = l.oms.some(o => o.est.includes("REPROGRAMADA"));
      l.vencido = l.fmin <= C.fecha;
      l.anom = l.oms.length >= UMBRAL_MASIVA;
      l.cuenta = !(state.excl && l.anom);
      if (l.anom) masivas.push({ pl, l });
    });
    const itemsConLl = new Set(llam.map(l => l.item)).size;
    let esp = 0, espF = 0, horas = false;
    const nPluri = pl.frecs.filter(f => PLURI.includes(f)).length;
    pl.frecs.forEach(f => {
      if (PER[f]){ esp += PER[f]; if (PER[f] > 1) espF += Math.floor(PER[f] * frac); }
      else if (!PLURI.includes(f)) horas = true;
    });
    if (nPluri) esp += llam.length ? Math.min(nPluri, itemsConLl) : 0;

    const cnt = llam.filter(l => l.cuenta);
    const venc = cnt.filter(l => l.vencido), cum = venc.filter(l => l.cumplido);
    const fut = cnt.filter(l => !l.vencido);
    const meses = Array.from({ length: 12 }, () => ({ n: 0, ok: 0, bad: 0, rep: 0, fut: 0 }));
    cnt.forEach(l => {
      const m = meses[l.mes]; m.n++;
      if (!l.vencido) m.fut++;
      else if (l.cumplido) m.ok++;
      else if (l.reprog) m.rep++;
      else m.bad++;
    });
    const faltan = espF ? Math.max(0, espF - llam.filter(l => l.vencido).length) : 0;
    let caso;
    if (!pl.omsAll.length) caso = "Sin OM en el dashboard";
    else if (!pl.oms.length) caso = "Sin OM en el año";
    else if (esp && llam.length / esp >= 1.8 && llam.length - esp >= 2) caso = "Más llamados que la frecuencia";
    else if (esp && llam.length > esp) caso = "Exceso leve (ajuste de plan)";
    else if (faltan > 0) caso = "Faltan llamados a la fecha";
    else if (!llam.some(l => l.vencido)) caso = "Solo llamados futuros";
    else caso = "Normal";
    Object.assign(pl, {
      llamados: llam, nLlam: llam.length, esp, espF, faltan, horas, caso, meses,
      venc: venc.length, cum: cum.length, pend: venc.length - cum.length, fut: fut.length,
      cumTope: esp ? Math.min(cum.length, esp) : cum.length,
      frecTxt: [...new Set(pl.frecs)].map(f => f ? f[0].toUpperCase() + f.slice(1) : "—").join(" / ")
    });
    lista.push(pl);
  });

  const claves = Object.keys(TEMAS);
  const grupoDe = (t) => (TEMAS[t] && TEMAS[t].grupo) || "Otros";
  const temas = [...new Set(lista.map(p => p.tema))].sort((a, b) => {
    const ga = GRUPOS.indexOf(grupoDe(a)), gb = GRUPOS.indexOf(grupoDe(b));
    const ka = claves.indexOf(a), kb = claves.indexOf(b);
    return (ga * 1000 + (ka < 0 ? 999 : ka)) - (gb * 1000 + (kb < 0 ? 999 : kb));
  });
  M = { C, planes: lista, temas, grupoDe, fuera: [...fuera.values()], correctivas, masivas };
}

function agg(pls){
  const r = { planes: pls.length, items: 0, esp: 0, venc: 0, cum: 0, pend: 0, cumTope: 0, fut: 0, prox: 0,
              mOk: Array(12).fill(0), mBad: Array(12).fill(0), mRep: Array(12).fill(0), mFut: Array(12).fill(0) };
  const lim = addDays(M.C.fecha, 30);
  pls.forEach(p => {
    r.items += p.filas; r.esp += p.esp; r.venc += p.venc; r.cum += p.cum; r.pend += p.pend; r.cumTope += p.cumTope; r.fut += p.fut;
    p.meses.forEach((m, i) => { r.mOk[i] += m.ok; r.mBad[i] += m.bad; r.mRep[i] += m.rep; r.mFut[i] += m.fut; });
    p.llamados.forEach(l => { if (l.cuenta && !l.vencido && !l.cumplido && l.fmin <= lim) r.prox++; });
  });
  r.pct = r.venc ? r.cum / r.venc : null;
  r.avance = r.esp ? r.cumTope / r.esp : null;
  return r;
}

/* ---------- Formato ---------- */
const pctTxt = (x) => x === null ? "—" : (x * 100).toFixed(x >= 0.995 || x === 0 ? 0 : 1).replace(".", ",") + "%";
const nivel = (x) => x === null ? "" : x >= 0.95 ? "good" : x >= 0.85 ? "mid" : "bad";
const color = (x) => x === null ? "var(--border-strong)" : x >= 0.95 ? "var(--success-mid)" : x >= 0.85 ? "var(--warning-mid)" : "var(--danger-mid)";

/* ---------- Pestañas ---------- */
function renderTabs(){
  const grupos = {};
  M.temas.forEach(t => (grupos[M.grupoDe(t)] = grupos[M.grupoDe(t)] || []).push(t));
  const mk = (n, pct) => `<button class="tab${state.vista === n ? " active" : ""}" data-v="${esc(n)}">${esc(n)}${pct !== undefined ? `<span class="pct ${nivel(pct)}">${pctTxt(pct)}</span>` : ""}</button>`;
  let h = `<div class="tab-group">${mk("Resumen")}</div>`;
  GRUPOS.concat(Object.keys(grupos).filter(g => !GRUPOS.includes(g))).forEach(g => {
    if (!grupos[g]) return;
    h += `<div class="tab-group"><span class="tab-group-label">${esc(g)}</span>${grupos[g].map(t => mk(t, agg(M.planes.filter(p => p.tema === t)).pct)).join("")}</div>`;
  });
  h += `<div class="tab-group">${mk("Control de datos")}</div>`;
  $("tabs").innerHTML = h;
  $("tabs").querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => irA(b.dataset.v)));
}
function irA(v){ state.vista = v; saveCfg({ vista: v }); render(); window.scrollTo({ top: 0 }); }

/* ---------- KPIs y gráfico ---------- */
function kpis(a){
  return `<section class="kpi-row">
    <div class="kpi-card k-accent"><p class="kpi-label">Cumplimiento a la fecha</p>
      <p class="kpi-value" style="color:${color(a.pct)}">${pctTxt(a.pct)}</p>
      <p class="kpi-sub">${a.cum} de ${a.venc} llamados vencidos ${esc(M.C.txt)}</p></div>
    <div class="kpi-card k-success"><p class="kpi-label">Avance del año</p>
      <p class="kpi-value">${pctTxt(a.avance)}</p>

    <div class="kpi-card k-danger"><p class="kpi-label">Pendientes vencidos</p>
      <p class="kpi-value" style="color:${a.pend ? "var(--danger)" : "inherit"}">${a.pend}</p>
      <p class="kpi-sub">llamados vencidos sin OM cerrada</p></div>
    <div class="kpi-card k-warning"><p class="kpi-label">Próximos 30 días</p>
      <p class="kpi-value">${a.prox}</p>
      <p class="kpi-sub">llamados a vencer después del corte</p></div>
  </section>`;
}
function chartMes(id, a){
  if (!window.Chart || !$(id)) return;
  if (charts[id]) charts[id].destroy();
  Chart.defaults.font.family = "'IBM Plex Sans', -apple-system, Segoe UI, Roboto, sans-serif";
  Chart.defaults.color = "#5B6474";
  charts[id] = new Chart($(id), {
    type: "bar",
    data: { labels: MS, datasets: [
      { label: "Cumplidos", data: a.mOk, backgroundColor: "#2E9A57", stack: "s", borderRadius: 3 },
      { label: "Reprogramados", data: a.mRep, backgroundColor: "#D98A1C", stack: "s", borderRadius: 3 },
      { label: "Vencidos sin cerrar", data: a.mBad, backgroundColor: "#D2434A", stack: "s", borderRadius: 3 },
      { label: "Por vencer", data: a.mFut, backgroundColor: "#C9D6E8", stack: "s", borderRadius: 3 }
    ]},
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } },
      scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, grid: { color: "#EEF1F4" } } } }
  });
}
function filaAgg(nombre, desc, a, clickable){
  return `<div class="tema-row"${clickable ? ` tabindex="0" data-v="${esc(nombre)}"` : ` style="cursor:default"`}>
    <div><div class="tema-name">${esc(nombre)}</div>${desc ? `<div class="tema-desc">${esc(desc)}</div>` : ""}</div>
    <div class="bar-col"><div class="bar"><span style="width:${a.pct === null ? 0 : a.pct * 100}%;background:${color(a.pct)}"></span></div>
      <div class="bar-meta">${a.cum}/${a.venc} vencidos · ${a.planes} planes · ${a.items} equipos</div></div>
    <div class="tema-pct" style="color:${color(a.pct)}">${pctTxt(a.pct)}</div>
    <div class="tema-late">${a.pend ? `<b>${a.pend}</b> pendiente${a.pend > 1 ? "s" : ""}` : "Al día"}</div></div>`;
}

/* ---------- Pendientes ---------- */
function pendientes(pls){
  const out = [];
  pls.forEach(p => p.llamados.forEach(l => { if (l.cuenta && l.vencido && !l.cumplido) out.push({ p, l, atraso: dias(l.fmin, M.C.fecha) }); }));
  return out.sort((a, b) => b.atraso - a.atraso);
}
function tablaPend(lista, conTema){
  if (!lista.length) return `<div class="empty">No hay llamados vencidos pendientes al corte.</div>`;
  const LIM = 80;
  return `<div class="tbl-wrap"><table class="simple"><thead><tr>${conTema ? "<th>Tema</th>" : ""}<th>N° Plan</th><th>Actividad</th><th>Equipo / ubicación</th><th>Fecha inicio</th><th>OM</th><th>Atraso</th></tr></thead><tbody>` +
    lista.slice(0, LIM).map(x => `<tr>${conTema ? `<td>${esc(x.p.tema)}</td>` : ""}<td class="mono">${esc(x.p.plan)}</td><td>${esc(x.l.desc)}</td>
      <td class="mono" style="font-size:11.5px">${esc(x.l.eqTxt)}</td><td>${fmtF(x.l.fmin)}</td>
      <td>${x.l.oms.slice(0, 3).map(o => `<span class="mono">${esc(o.om)}</span> <span class="chip${o.est.includes("REPROG") ? " rep" : ""}">${esc(o.est.toLowerCase())}</span>`).join("<br>")}${x.l.oms.length > 3 ? `<br><span class="caso">y ${x.l.oms.length - 3} OM más del mismo equipo y mes</span>` : ""}</td>
      <td><span class="chip late">${x.atraso} días</span></td></tr>`).join("") +
    `</tbody></table></div>${lista.length > LIM ? `<p class="more">Se muestran los ${LIM} más atrasados de ${lista.length}. El CSV trae todos.</p>` : ""}`;
}
function csvPend(lista){
  const q = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const rows = [["Tema","N° Plan","Tipo","Actividad","Equipo/Ubicación","Fecha inicio","OM","Estatus","Días de atraso"]]
    .concat(lista.map(x => [x.p.tema, x.p.plan, x.p.tipo, x.l.desc, x.l.eqTxt, x.l.fmin, x.l.oms.map(o => o.om).join(" "), x.l.oms.map(o => o.est).join(" / "), x.atraso]));
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(q).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `GPM_llamados_pendientes_${M.C.fecha}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Vista: Resumen ---------- */

  $("view").innerHTML = `

    ${kpis(a)}
    <div class="grid-2">

        <div class="tema-list">${M.temas.map(t => filaAgg(t, TEMAS[t] ? TEMAS[t].desc : "", agg(M.planes.filter(p => p.tema === t)), true)).join("")}</div>
        <div class="mini-list">${tipos.map(x => `<div class="row"><span>${x.t} · ${x.a.planes} planes</span><b style="color:${color(x.a.pct)}">${pctTxt(x.a.pct)}</b></div>`).join("")}</div></div>
      <div class="panel"><h3>Llamados por mes</h3><p class="panel-sub">Un llamado es un plan + equipo + mes. Se cumple con al menos una OM cerrada.</p>

      ${pend.length ? `<button class="btn" id="csvBtn">Descargar CSV</button>` : ""}</div>${tablaPend(pend, true)}</div>`;

    <div class="grid-2">

function celda(m){
  if (!m.n) return `<i class="cell emp"></i>`;
  const cls = m.bad ? "bad" : m.rep ? "rep" : m.fut && !m.ok ? "fut" : "ok";
  return `<span class="cell ${cls}" title="${m.n} llamado(s): ${m.ok} cumplidos, ${m.bad} vencidos sin cerrar, ${m.rep} reprogramados, ${m.fut} por vencer">${m.n}</span>`;
}
function renderMatriz(pls, f){
  const q = f.q.trim().toLowerCase();
  const lista = pls.filter(p => (!f.caso || p.caso === f.caso) && (!f.solo || p.pend > 0) &&
    (!q || `${p.plan} ${p.desc}`.toLowerCase().includes(q))).sort((a, b) => b.pend - a.pend || a.plan.localeCompare(b.plan));
  $("fCount").textContent = `${lista.length} de ${pls.length} planes`;
  const cm = M.C.mes;
  let h = `<table class="mx"><thead><tr><th class="l">Plan</th><th>Frecuencia</th><th>Equipos</th><th>Esperados</th>` +
    MS.map((m, i) => `<th class="mo${i === cm ? " curm" : ""}">${m}</th>`).join("") + `<th>Vencidos</th><th>Cumplidos</th><th>% a la fecha</th></tr></thead><tbody>`;
  if (!lista.length) h += `<tr><td colspan="19"><div class="empty">Ningún plan coincide con los filtros.</div></td></tr>`;
  lista.forEach(p => {
    const pct = p.venc ? p.cum / p.venc : null;
    const warn = !["Normal", "Exceso leve (ajuste de plan)", "Solo llamados futuros"].includes(p.caso);
    h += `<tr class="pl" data-p="${esc(p.plan)}"><td class="info"><div class="act">${esc(p.desc)}</div>
        <div class="act-meta"><span class="mono">${esc(p.plan)}</span> · ${esc(p.tipo)} · <span class="caso${warn ? " warn" : ""}">${esc(p.caso)}</span></div></td>
      <td>${esc(p.frecTxt)}</td><td class="num">${p.filas}</td><td class="num">${p.esp || "—"}</td>` +
      p.meses.map((m, i) => `<td class="mo${i === cm ? " curm" : ""}">${celda(m)}</td>`).join("") +
      `<td class="num">${p.venc}</td><td class="num">${p.cum}</td><td style="font-weight:600;color:${color(pct)}">${pctTxt(pct)}</td></tr>`;
    if (state.abiertos.has(p.plan)){
      const oms = p.oms.slice().sort((a, b) => a.fi.localeCompare(b.fi));
      h += `<tr class="det"><td colspan="19">${oms.length ? `<div class="om-list">${oms.map(o => `<div><span class="mono">${esc(o.om)}</span><span>${fmtF(o.fi)}</span><span class="mono" style="color:var(--text-muted)">${esc(o.eq || o.ut)}</span><span class="st chip${o.est.includes("CERRADA") ? " ok" : o.est.includes("REPROG") ? " rep" : ""}">${esc(o.est.toLowerCase())}</span></div>`).join("")}</div>` : "Sin OM en el año."}</td></tr>`;
    }
  });
  $("mx").innerHTML = h + "</tbody></table>";
  $("mx").querySelectorAll("tr.pl").forEach(tr => tr.addEventListener("click", () => {
    const p = tr.dataset.p; state.abiertos.has(p) ? state.abiertos.delete(p) : state.abiertos.add(p); renderMatriz(pls, f);
  }));
}

      <div class="panel"><h3>OM masivas repetidas</h3><p class="panel-sub">Se pueden excluir del cálculo con la opción de arriba</p>
        ${Object.keys(masPorPlan).length ? `<div class="tbl-wrap"><table class="simple"><thead><tr><th>N° Plan</th><th>Actividad</th><th>Llamados</th><th>OM</th><th>Meses</th></tr></thead><tbody>` +
          Object.values(masPorPlan).map(x => `<tr><td class="mono">${esc(x.pl.plan)}</td><td>${esc(x.pl.desc)}</td><td class="num">${x.n}</td><td class="num">${x.oms}</td><td>${[...x.meses].join(", ")}</td></tr>`).join("") +
          `</tbody></table></div>` : `<div class="empty">No se detectaron OM masivas.</div>`}</div>
    </div>`;
}

/* ---------- Render general ---------- */
function render(){
  construir();
  if (!["Resumen", "Control de datos"].includes(state.vista) && !M.temas.includes(state.vista)) state.vista = "Resumen";
  renderTabs();
  if (state.vista === "Resumen") renderResumen();
  else if (state.vista === "Control de datos") renderControl();
  else renderTema(state.vista);
  $("footer").textContent = `Año ${M.C.anio} · Corte ${fmtF(M.C.fecha)} · ${raw.om.length} OM leídas · ${raw.planes.length} filas de planes · Fuente: ${state.fuente === "demo" ? "datos de demostración" : "Google Sheets (GPM26 + Planes)"}`;
}

function llenarCorte(){
  const sel = $("corteSelect");
  sel.innerHTML = `<option value="hoy">Hoy</option>` + MESES.map((m, i) => `<option value="${i}">Cierre de ${m}</option>`).join("");
  sel.value = state.corte;
  sel.addEventListener("change", () => { state.corte = sel.value; render(); });
}
function setStatus(t, x){ $("statusDot").className = "dot " + t; $("statusText").textContent = x; }

function demoRaw(){
  const kPl = ["N° Plan","Ubicación técnica","Equipo","Descripción","Clase Plan","Frecuencia SAP","Frecuencia a usar","Tema"];
  const kOm = ["Grupo","N° OM","Clase OM","Ubicación Técnica","Fecha Inicio","Fecha Fin","Descripción","Estatus","N° Plan","Equipo"];
  const obj = (k, r) => Object.fromEntries(k.map((c, i) => [c, r[i]]));
  return { om: (DEMO.om || []).map(r => obj(kOm, r)), planes: (DEMO.pl || []).map(r => obj(kPl, r)) };
}

async function cargar(){
  const url = $("sheetUrl").value.trim();
  if (!DEFAULT_URL) saveCfg({ url });
  if (!url){
    raw = demoRaw(); state.fuente = "demo";
    setStatus("demo", raw.om.length ? "Modo demostración: datos de la copia del dashboard y del listado de planes. Pegá la URL del Apps Script para ver los datos en línea."
                                    : "Pegá la URL del Apps Script y tocá Actualizar para cargar los datos.");
    render(); return;
  }
  const btn = $("refreshBtn"); btn.disabled = true; btn.textContent = "Actualizando…";
  setStatus("", "Consultando la hoja…");
  try{
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    if (!Array.isArray(d.om) || !Array.isArray(d.planes)) throw new Error("la respuesta no trae 'om' y 'planes'");
    if (!d.planes.length) throw new Error("la pestaña Planes está vacía o no existe");
    raw = { om: d.om, planes: d.planes }; state.fuente = "sheets";
    const t = d.generado ? new Date(d.generado) : new Date();
    setStatus("ok", `Conectado a ${d.archivo || "Google Sheets"} · leído el ${t.toLocaleDateString("es-AR")} a las ${t.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}`);
    render();
  }catch(err){
    setStatus("err", `No se pudo leer la hoja: ${err.message}. Revisá la URL y que la implementación tenga acceso "Cualquier persona".`);
    if (!M){ raw = demoRaw(); render(); }
  }finally{ btn.disabled = false; btn.textContent = "Actualizar"; }
}

(function init(){
  const cfg = loadCfg();
  $("sheetUrl").value = DEFAULT_URL || cfg.url || "";   // la URL fija del archivo tiene prioridad sobre la guardada en el navegador
  if (cfg.vista) state.vista = cfg.vista;
  state.excl = !!cfg.excl; $("exclAnom").checked = state.excl;
  $("exclAnom").addEventListener("change", e => { state.excl = e.target.checked; saveCfg({ excl: state.excl }); render(); });
  llenarCorte();
  $("refreshBtn").addEventListener("click", cargar);
  $("sheetUrl").addEventListener("keydown", e => { if (e.key === "Enter") cargar(); });
  cargar();
})();
</script>
</body>
